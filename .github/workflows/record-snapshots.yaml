# Temporary: records vdiffr snapshots for the current CRAN ggplot2 and
# commits them to the branch. Remove once snapshots are reviewed.
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/record-snapshots.yaml']

name: record-snapshots.yaml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools
          needs: check
      - name: Record snapshots
        env:
          EFFECTZONES_RECORD_SNAPSHOTS: 'true'
          # testthat fails on new snapshots when CI is set; here new
          # snapshots are the point.
          CI: 'false'
        run: |
          devtools::test(stop_on_failure = TRUE)
          print(list.files("tests/testthat/_snaps", recursive = TRUE))
          print(packageVersion("ggplot2"))
        shell: Rscript {0}
      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/testthat/_snaps
          git commit -m "Record vdiffr snapshots on CI ggplot2" || echo "nothing to commit"
          git push
